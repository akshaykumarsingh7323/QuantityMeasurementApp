services:
  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    networks:
      - quantity-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - quantity-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$DB_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - quantity-net

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS}
      - ADMIN_SERVER_URL=http://admin-server:9090
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - quantity-net

  auth-service:
    build: ./auth-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - DB_URL_AUTH=jdbc:mysql://db:3306/quantitymeasurement_auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - APP_AUTH_TOKEN_SECRET=${APP_AUTH_TOKEN_SECRET}
      - APP_OAUTH2_REDIRECT_URI=${APP_OAUTH2_REDIRECT_URI}
      - APP_RESET_PASSWORD_URL=${APP_RESET_PASSWORD_URL}
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - quantity-net

  user-service:
    build: ./user-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - DB_URL_USER=jdbc:mysql://db:3306/quantitymeasurement_user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - quantity-net

  measurement-service:
    build: ./measurement-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - DB_URL_MEASUREMENT=jdbc:mysql://db:3306/quantitymeasurement_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - quantity-net

  admin-server:
    build: ./admin-server
    ports:
      - "9090:9090"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - quantity-net

networks:
  quantity-net:
    driver: bridge

volumes:
  mysql_data:
