server:
    port: 9090

spring:
    application:
        name: admin-server
    security:
        user:
            name: ${ADMIN_USERNAME:admin}
            password: ${ADMIN_PASSWORD:admin123}

eureka:
    client:
        service-url:
            defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8761/eureka/}

management:
    endpoints:
        web:
            exposure:
                include: "*"
    endpoint:
        health:
            show-details: always

